org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# JDK 25 toolchain
# ------------------------------------------------------------------------------
# AGP 9 需要 JDK 25。不指定路径时 Gradle 会去 api.foojay.io 下载约 100MB 的 temurin，
# 网络受限的环境下会长时间无输出（看起来像卡死，其实在等下载超时）。
#
# 如果你本机已有 JDK 25（Android Studio 自带的 JBR 即是），**建议写在用户级配置里**
# 而不是项目里，避免把个人路径提交进仓库：
#
#   ~/.gradle/gradle.properties（Windows: C:\Users\<你>\.gradle\gradle.properties）
#   org.gradle.java.installations.paths=/path/to/jbr
#   org.gradle.java.installations.auto-download=false
#
# 也可以直接用环境变量指定 JAVA_HOME 后运行 ./gradlew。
org.gradle.java.installations.auto-download=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
# AGP 9.x 自带 Kotlin 支持，不关掉会与应用 kotlin-android 插件抢 "kotlin" 扩展
android.builtInKotlin=false
android.newDsl=false
